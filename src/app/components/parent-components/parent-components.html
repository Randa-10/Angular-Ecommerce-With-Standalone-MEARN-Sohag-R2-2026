<p>parent-components</p>
<!-- search -->

<div class="mt-2">
  <!-- <input class="form-control" [value]="username" > -->
  <!-- two  binding  [(ngModel)]="prop"-->
  <!-- <input class="form-control"  [(ngModel)]="username" > -->
  <input class="form-control" [(ngModel)]="searchInParent" />
</div>

<!-- prd list -->
<!-- fire child ==>($event){} -->
<app-products
  (prdEvent)="AddToCartInParent($event)"
  [filterProduct]="searchInParent"

></app-products>

<table class="table table-dark table-borderless container">
  <thead>
    <tr>
      <th>product name</th>
      <th>product price</th>
      <th>product qty</th>
    </tr>
  </thead>
  <tbody>
    @for (items of prdList; track items.id) {
      <tr>
        <td>{{ items.productName }}</td>
        <td>{{ items.productPrice }}</td>
        <td>{{ items.productQuantity }}</td>
      </tr>
    }
  </tbody>
</table>
